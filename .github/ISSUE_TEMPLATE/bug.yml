name: Bug
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps
      description: What steps caused the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Output
      description: What is the expected output.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Details (optional)
      description: Give any additional details that will help.
    validations:
      required: false
