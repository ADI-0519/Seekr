name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_dev.txt
      - name: Install NLTK test data
        run: python -m nltk.downloader stopwords
      - name: Type check
        run: mypy .
      - name: Run unit tests
        run: pytest -q -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=65

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      COMPOSE_PROJECT_NAME: seekr-ci-${{ github.run_id }}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/SeekrDB
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/SeekrDB
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      QDRANT_URL: http://localhost:6333
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_BUCKET: seekr-videos
      STORAGE_ACCESS_KEY_ID: minio_local
      STORAGE_SECRET_ACCESS_KEY: minio_local_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_dev.txt
      - name: Write isolated Compose environment
        shell: bash
        run: |
          cat > ../.env <<'EOF'
          POSTGRES_DB=SeekrDB
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/SeekrDB
          REDIS_URL=redis://redis:6379/0
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
          CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          QDRANT_URL=http://qdrant:6333
          MINIO_ROOT_USER=minio_local
          MINIO_ROOT_PASSWORD=minio_local_password
          STORAGE_ENDPOINT_URL=http://minio:9000
          STORAGE_BUCKET=seekr-videos
          STORAGE_ACCESS_KEY_ID=minio_local
          STORAGE_SECRET_ACCESS_KEY=minio_local_password
          EOF
      - name: Start integration services
        run: >-
          docker compose up --detach --build
          db redis rabbitmq qdrant minio
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db pg_isready -U postgres -d SeekrDB \
              && curl --fail --silent http://localhost:6333/collections >/dev/null \
              && curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Apply database migrations
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run integration tests
        run: pytest -q -m integration
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop integration services
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run frontend tests
        run: npm test -- --runInBand

  e2e:
    name: Browser smoke test
    # Playwright 1.53 does not provide Chromium on a supported image.
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run e2e

  deploy-production:
    name: Deploy frontend to production
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build production frontend
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy production frontend
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
