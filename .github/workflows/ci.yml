name: CI

on:
  push:
    branches: [main, develop, release/**, hotfix/**]
  pull_request:
    branches: [main, develop, release/**, hotfix/**]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: ci/precommit
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
        - name: fix workspace permissions
          run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - name: Install pre-commit
          run: python -m pip install -U pip pre-commit
        - name: Run pre-commit
          run: pre-commit run --all-files

  backend-unit:
    name: ci/backend-unit
    runs-on: [self-hosted, linux, x64]
    needs: pre-commit
    defaults:
        run:
            working-directory: backend
    steps:
        - name: fix workspace permissions
          run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            # cache: "pip"
            # cache-dependency-path: |
            #   backend/requirements.txt
            #   backend/requirements_dev.txt
        - name: Install FFmpeg
          run: sudo apt-get update && sudo apt-get install -y ffmpeg

        - name: Upgrade pip (unit)
          run: python -m pip install -U pip
        - name: Install backend unit dependencies
          run: pip install -r requirements_dev.txt
        - name: Run mypy
          run: mypy .
        - name: Run unit tests with coverage gate
          run: pytest -q -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=65

  backend-integration:
    name: ci/backend-integration
    runs-on: [self-hosted, linux, x64]
    needs: backend-unit
    timeout-minutes: 45
    defaults:
        run:
            working-directory: backend
    steps:
        - name: fix workspace permissions
          run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - name: Install FFmpeg
          run: sudo apt-get update && sudo apt-get install -y ffmpeg

        - name: Upgrade pip (integration)
          run: python -m pip install -U pip
        - name: Install backend dependencies
          run: pip install -r requirements_dev.txt

        - name: Install ML dependencies
          run: pip install -r requirements_ml.txt

        - name: Download eval artifacts
          run: |
            pip install gdown --quiet
            python scripts/download_artifacts.py --eval
          continue-on-error: true

        - name: Verify Docker daemon is available
          run: docker info > /dev/null

        - name: Teardown previous stack
          run: |
            docker compose -f docker-compose.yml down -v --remove-orphans || true
            rm -f ../.env

        - name: Create .env for docker compose
          run: |
            cat > ../.env << 'EOF'
            POSTGRES_DB=SeekrDB
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=postgres

            DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/SeekrDB

            REDIS_URL=redis://redis:6379/0

            RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
            CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
            CELERY_RESULT_BACKEND=redis://redis:6379/1
            QDRANT_URL=http://qdrant:6333

            MINIO_ROOT_USER=minioadmin
            MINIO_ROOT_PASSWORD=minioadmin
            STORAGE_ENDPOINT_URL=http://minio:9000
            STORAGE_BUCKET=seekr-videos
            STORAGE_ACCESS_KEY_ID=minioadmin
            STORAGE_SECRET_ACCESS_KEY=minioadmin
            EOF

        - name: Start services
          run: docker compose -f docker-compose.yml up -d --build --scale celery_worker=0 --scale celery_worker_slides=0

        - name: Show migrate logs
          if: always()
          run: docker compose logs migrate

        - name: Wait for services
          run: |
            set -e

            DB_READY=0
            for i in {1..90}; do
              if docker compose exec -T db pg_isready -U postgres -d SeekrDB; then
                DB_READY=1
                break
              fi
              sleep 2
            done

            if [ "$DB_READY" -ne 1 ]; then
              echo "Postgres not ready"
              docker compose ps || true
              docker compose logs db || true
              exit 1
            fi

            for i in {1..60}; do
              (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && \
              (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 && \
              (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1 && \
              (echo > /dev/tcp/127.0.0.1/6333) >/dev/null 2>&1 && \
              (echo > /dev/tcp/127.0.0.1/9000) >/dev/null 2>&1 && \
              echo "All ports open" && exit 0
              sleep 2
            done
            echo "Services didn't become ready"
            docker compose ps || true
            docker compose logs || true
            exit 1

        - name: Run integration tests
          run: pytest -q -m integration
          env:
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/SeekrDB
            ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/SeekrDB
            REDIS_URL: redis://localhost:6379/0
            CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
            CELERY_RESULT_BACKEND: redis://localhost:6379/1
            QDRANT_URL: http://localhost:6333
            STORAGE_ENDPOINT_URL: http://localhost:9000
            STORAGE_BUCKET: seekr-videos
            STORAGE_ACCESS_KEY_ID: minioadmin
            STORAGE_SECRET_ACCESS_KEY: minioadmin

        - name: Stop services + cleanup
          if: always()
          run: |
            docker compose down -v --remove-orphans || true
            rm -f ../.env

        - name: Docker disk usage
          if: always()
          run: docker system df

  frontend:
    name: ci/frontend
    runs-on: [self-hosted, linux, x64]
    needs: pre-commit
    defaults:
        run:
            working-directory: frontend
    steps:
        - name: fix workspace permissions
          run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: frontend/package-lock.json
        - name: Install frontend dependencies
          run: npm ci
        - name: Run frontend tests
          run: npm test
        - name: Run frontend performance tests
          run: npm run reassure

  e2e:
    name: ci/e2e
    runs-on: [self-hosted, linux, x64]
    needs: [backend-integration, frontend]
    if: ${{ vars.ENABLE_E2E == 'true' }}
    defaults:
        run:
            working-directory: frontend
    steps:
        - name: fix workspace permissions
          run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
        - uses: actions/checkout@v4
        - name: Detect E2E test files
          id: detect_e2e
          run: |
            if ls playwright.config.* >/dev/null 2>&1 && [ -d e2e ] && find e2e -type f | grep -q .; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
        - uses: actions/setup-node@v4
          if: steps.detect_e2e.outputs.enabled == 'true'
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: frontend/package-lock.json
        - name: Install frontend dependencies
          if: steps.detect_e2e.outputs.enabled == 'true'
          run: npm ci
        - name: Install Playwright browsers
          if: steps.detect_e2e.outputs.enabled == 'true'
          run: npx playwright@1.53.2 install --with-deps
        - name: Run Playwright E2E
          if: steps.detect_e2e.outputs.enabled == 'true'
          run: npx playwright@1.53.2 test
        - name: Skip E2E (no tests/config found)
          if: steps.detect_e2e.outputs.enabled != 'true'
          run: |
            echo "Skipping E2E: playwright config or e2e tests not found."

  deploy-vercel-production:
    name: deploy/vercel-production
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    needs: [backend-integration, frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: fix workspace permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }} || true
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build frontend for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
