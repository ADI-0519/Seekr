x-worker-common: &worker-common
  build:
    context: .
    dockerfile: ./app/Dockerfile
    args:
      INSTALL_ML: "true"
  restart: unless-stopped
  user: celeryuser
  env_file:
    - ../.env
  environment:
    WHISPER_DEVICE: cpu
    NVIDIA_VISIBLE_DEVICES: ""
    NVIDIA_DRIVER_CAPABILITIES: ""
    HF_HUB_DISABLE_XET: "1"
    HF_HOME: /home/celeryuser/.cache/huggingface
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  volumes:
    - huggingface_cache:/home/celeryuser/.cache/huggingface
    - easyocr_cache:/home/celeryuser/.EasyOCR
    - ./runs/finetune:/models/finetuned:ro
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully

services:
  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        INSTALL_ML: "false"
    container_name: videos_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 15

  db:
    image: postgres:15
    container_name: PostgresDB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SeekrDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-SeekrDB} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    build:
      context: ./app
      dockerfile: Dockerfile.qdrant
    image: custom-qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:6333/collections || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile.server
    image: seekr-minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8081,http://localhost:3000
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-init:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile.client
    image: seekr-minio-client:RELEASE.2025-08-13T08-35-41Z
    env_file:
      - ../.env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${STORAGE_BUCKET:-seekr-videos}"
        /usr/bin/mc anonymous set none "local/$${STORAGE_BUCKET:-seekr-videos}"

  migrate:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        INSTALL_ML: "false"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"

  celery_worker:
    <<: *worker-common
    container_name: videos_worker
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "default", "--pool=solo"]

  celery_worker_transcription:
    <<: *worker-common
    container_name: videos_worker_transcription
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "transcription", "--pool=solo"]

  celery_worker_slides:
    <<: *worker-common
    container_name: videos_worker_slides
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "slides", "--pool=solo"]

  celery_worker_retrieval:
    <<: *worker-common
    container_name: videos_worker_retrieval
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "retrieval", "--pool=solo"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - ./advanced.config:/etc/rabbitmq/advanced.config:ro

  model-init:
    profiles: [setup]
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        INSTALL_ML: "true"
    user: "0:0"
    environment:
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - huggingface_cache:/home/celeryuser/.cache/huggingface
      - easyocr_cache:/home/celeryuser/.EasyOCR
      - ../.cache/hf:/seed/hf
      - ./scripts/hf_cache_init.sh:/usr/local/bin/hf_cache_init.sh:ro
      - ./scripts/ensure_models.py:/usr/local/bin/ensure_models.py:ro
    entrypoint: ["bash", "/usr/local/bin/hf_cache_init.sh"]
    restart: "no"

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  huggingface_cache:
    name: huggingface_cache
  easyocr_cache:
    name: easyocr_cache
