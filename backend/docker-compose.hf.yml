services:
  hf_cache_init:
    build:
      context: .
      dockerfile: ./app/Dockerfile.worker-gpu
      args:
        INSTALL_ML: "true"
    user: "0:0"
    restart: "no"
    environment:
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - huggingface_cache:/home/celeryuser/.cache/huggingface
      - easyocr_cache:/home/celeryuser/.EasyOCR
      - ../.cache/hf:/seed/hf:ro
      - ./scripts/hf_cache_init.sh:/usr/local/bin/hf_cache_init.sh
      - ./scripts/ensure_models.py:/usr/local/bin/ensure_models.py
    command: [ "bash", "/usr/local/bin/hf_cache_init.sh" ]

volumes:
  huggingface_cache:
    external: true
  easyocr_cache:
    external: true
